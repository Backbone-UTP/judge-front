<div class="workspace-layout">
  <header class="top-header">
    <div class="logo">Backbone Judge</div>
    <nav class="top-nav">
      <span>Problems</span>
    </nav>
  </header>

  <div class="workspace-toolbar">
    <div class="problem-tabs">
      <button class="tab active" type="button">Description</button>
      <button class="tab" type="button">Submissions</button>
      <button class="tab" type="button">Hints</button>
    </div>

    <div class="language-tab">
      <span>JavaScript</span>
    </div>
  </div>

  <main class="workspace-main">
    <section class="workspace-panel workspace-problem">
      <div class="problem-content">
        <h1>{{ challenge().title }}</h1>
        @for (paragraph of challenge().descriptionParagraphs; track $index) {
          <p>{{ paragraph }}</p>
        }
        @for (example of challenge().examples; track $index) {
          <app-example-block [example]="example" [index]="$index + 1" />
        }
        <app-constraints-list [constraints]="challenge().constraints" />
      </div>
    </section>

    <section class="workspace-panel workspace-editor">
      <div class="editor-content">
        <pre><code>{{ challenge().editorSnippet }}</code></pre>
      </div>
    </section>
  </main>

  <footer class="workspace-footer">
    <button class="btn" type="button">Run Code</button>
    <button class="btn btn-primary" type="button">Submit</button>
  </footer>
</div>
