<div class="workspace-layout">
  <header class="top-header">
    <div class="logo">Backbone Judge</div>
    <nav class="top-nav">
      <span>Problems</span>
    </nav>
  </header>

  <div class="workspace-toolbar">
    <div class="problem-tabs">
      <button class="tab active" type="button">Description</button>
      <button class="tab" type="button">Submissions</button>
      <button class="tab" type="button">Hints</button>
    </div>

    <div class="language-tab">
      <label for="language-selector">Language</label>
      <select
        id="language-selector"
        [value]="challengeWorkspaceState.selectedLanguage()"
        (change)="onLanguageChange($event)"
      >
        @for (language of challengeWorkspaceState.languages; track language) {
          <option [value]="language">{{ languageLabels[language] }}</option>
        }
      </select>
    </div>
  </div>

  <main class="workspace-main">
    <section class="workspace-panel workspace-problem">
      <app-problem-content></app-problem-content>
    </section>

    <section class="workspace-panel workspace-editor">
      <div class="editor-content">
        <app-code-editor
          [code]="challengeWorkspaceState.code()"
          [language]="challengeWorkspaceState.selectedLanguage()"
          (codeChange)="onCodeChange($event)"
        ></app-code-editor>
      </div>
    </section>
  </main>

  <footer class="workspace-footer">
    <button class="btn" type="button">Run Code</button>
    <button class="btn btn-primary" type="button">Submit</button>
  </footer>
</div>
