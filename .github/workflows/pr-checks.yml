name: PR checks

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: pr-checks-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Only files touched by the PR: main still has unformatted files, and a
      # repo-wide reformat would conflict with every open PR.
      - name: Prettier (changed files)
        run: |
          git diff -z --name-only --diff-filter=ACMR "origin/${{ github.base_ref }}...HEAD" \
            | xargs -0 -r npx prettier --check --ignore-unknown

      - name: Type-check
        run: npx tsc --noEmit -p tsconfig.app.json

      - name: Unit tests
        run: npm run test -- --watch=false
